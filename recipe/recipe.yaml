schema_version: 1

context:
  version: "2.1.2"
  python_min: "3.12"

package:
  name: slam-astro
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/slam-astro/slam_astro-${{ version }}.tar.gz
  sha256: 1060be6510c86e484c4a64c5810d28d090773866a0641f86cb4c3dab76db705a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - astropy-base >=7.2
    - corner
    - dynesty
    - emcee >=3.1.5
    - matplotlib-base
    - numba
    - numpy >=2.0
    - scipy
    - tqdm

tests:
  - python:
      imports:
        - channelfit
        - pvanalysis
        - pvfitting
        - velgrad
        - utils
      python_version:
        - ${{ python_min }}.*
        - "*"
      pip_check: true

about:
  summary: Spectral Line Analysis/Modeling for (sub)millimeter astronomy
  license: GPL-3.0-only
  license_file: LICENSE
  homepage: https://github.com/jinshisai/SLAM
  repository: https://github.com/jinshisai/SLAM
  documentation: https://slam-astro.readthedocs.io/

extra:
  recipe-maintainers:
    - jinshisai
    - yusukeaso-astron
